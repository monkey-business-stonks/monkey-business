spring:
  application:
    name: monkeybusiness-server
  
  datasource:
    url: jdbc:postgresql://localhost:5432/monkey_business
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        '[dialect]': org.hibernate.dialect.PostgreSQLDialect
        '[format_sql]': true
        '[use_sql_comments]': true
    show-sql: false
    open-in-view: false
  
server:
  port: 8080
  servlet:
    context-path: /api
