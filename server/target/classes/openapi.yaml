openapi: 3.0.0
info:
  title: Monkey Business Trading API
  version: 1.0.0
  description: >
    REST API for the Monkey Business trading platform. Provides endpoints for 
    user management, account operations, and order placement/tracking.
  contact:
    name: Monkey Business Team
  license:
    name: MIT

servers:
  - url: http://localhost:8080/api
    description: Local development server
  - url: https://api.monkeybusiness.example.com/api
    description: Production server

paths:
  /users:
    post:
      summary: Create a new user
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/{userId}:
    get:
      summary: Get user by ID
      tags:
        - Users
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid user ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/authenticate:
    post:
      summary: Authenticate user (login)
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticateRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/health:
    get:
      summary: Health check endpoint
      tags:
        - Health
      responses:
        '200':
          description: Service is running
          content:
            text/plain:
              schema:
                type: string

  /users/{userId}/accounts:
    post:
      summary: Create account for user
      tags:
        - Accounts
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: List all accounts for a user
      tags:
        - Accounts
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /accounts/{accountId}:
    get:
      summary: Get account details by ID
      tags:
        - Accounts
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Account found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          description: Invalid account ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /accounts/{accountId}/orders:
    post:
      summary: Place a new order
      tags:
        - Orders
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
      responses:
        '201':
          description: Order placed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Invalid order or insufficient funds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: Get order history for an account
      tags:
        - Orders
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDING, SUCCEEDED, REJECTED]
        - name: ticker
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderSummary'
        '400':
          description: Invalid account ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/{orderId}:
    get:
      summary: Get order details by ID
      tags:
        - Orders
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Invalid order ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /market/price/{ticker}:
    get:
      summary: Get current market data for a ticker
      tags:
        - Market Data
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
            description: Stock ticker symbol (e.g., AAPL, GOOGL)
      responses:
        '200':
          description: Market data retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketDataDto'
        '400':
          description: Invalid ticker
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /market/health:
    get:
      summary: Market Data service health check
      tags:
        - Health
      responses:
        '200':
          description: Service is running
          content:
            text/plain:
              schema:
                type: string

components:
  schemas:
    ErrorResponse:
      type: object
      required:
        - message
        - code
        - timestamp
      properties:
        message:
          type: string
          description: Error description
        code:
          type: string
          enum:
            - INVALID_INPUT
            - INVALID_ID
            - INVALID_ORDER
            - INVALID_CREDENTIALS
            - NOT_FOUND
            - SERVER_ERROR
        timestamp:
          type: integer
          format: int64
          description: Unix timestamp in milliseconds

    CreateUserRequest:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          description: Password must be at least 8 characters

    UserResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        userAccessLevel:
          type: string
          enum: [User, Analyst, Operations]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    AuthenticateRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        userAccessLevel:
          type: string
          enum: [User, Analyst, Operations]
        token:
          type: string
          description: Authentication token (if implemented)

    CreateAccountRequest:
      type: object
      required:
        - accountType
        - initialBalance
      properties:
        accountType:
          type: string
          enum: [BROKERAGE, _401K, ROTH_IRA, CRYPTO, FOREX]
        initialBalance:
          type: number
          format: double
          minimum: 0

    AccountResponse:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        accountType:
          type: string
          enum: [BROKERAGE, _401K, ROTH_IRA, CRYPTO, FOREX]
        balance:
          type: number
          format: double
        cashBalance:
          type: number
          format: double
        openedDate:
          type: string
          format: date-time
        totalInvested:
          type: number
          format: double
        portfolioValue:
          type: number
          format: double

    PlaceOrderRequest:
      type: object
      required:
        - ticker
        - quantity
        - action
      properties:
        ticker:
          type: string
          description: Stock ticker symbol
        quantity:
          type: number
          format: double
          minimum: 0.1
        action:
          type: string
          enum: [BUY, SELL]

    OrderResponse:
      type: object
      properties:
        orderId:
          type: string
          format: uuid
        ticker:
          type: string
        quantity:
          type: number
          format: double
        action:
          type: string
          enum: [BUY, SELL]
        status:
          type: string
          enum: [PENDING, SUCCEEDED, REJECTED]
        submittedOn:
          type: string
          format: date-time
        executedOn:
          type: string
          format: date-time
        submittedValue:
          type: number
          format: double
        executedValue:
          type: number
          format: double

    OrderSummary:
      type: object
      properties:
        orderId:
          type: string
          format: uuid
        ticker:
          type: string
        quantity:
          type: number
          format: double
        action:
          type: string
          enum: [BUY, SELL]
        status:
          type: string
          enum: [PENDING, SUCCEEDED, REJECTED]
        submittedOn:
          type: string
          format: date-time

    MarketDataDto:
      type: object
      properties:
        ticker:
          type: string
        price:
          type: number
          format: double
        timestamp:
          type: string
          format: date-time
