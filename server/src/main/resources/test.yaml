openapi: 3.0.3
info:
  title: Trading Platform API
  version: 2.0.0
  description: |
    External REST API for the trading monolith, aligned with the database schema.
    Validation, Execution, PricingEngine and TransactionManager are internal
    and are not exposed. Financial state (balances, asset quantities, order
    status and execution values) is never client-writable.
servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Users
  - name: Accounts
  - name: Orders
  - name: Assets

security:
  - bearerAuth: []

paths:
  /users:
    post:
      tags: [Users]
      summary: Create user
      operationId: createUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /users/authenticate:
    post:
      tags: [Users]
      summary: Login
      operationId: authenticateUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthenticateRequest' }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/logout:
    post:
      tags: [Users]
      summary: Logout
      operationId: logoutUser
      responses:
        '204': { description: Logged out }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: Get user info
      operationId: getUser
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/{userId}/status:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: Check authentication status
      operationId: getUserStatus
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/{userId}/accounts:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Accounts]
      summary: Create account for user
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAccountRequest' }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      tags: [Accounts]
      summary: Get all of a user's accounts
      operationId: listAccounts
      responses:
        '200':
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AccountResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /accounts/{accountId}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Accounts]
      summary: Get one account
      operationId: getAccount
      responses:
        '200':
          description: Account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Accounts]
      summary: Update account
      description: |
        Only client-editable fields. `balance` and `cashBalance` cannot be
        changed here; only TransactionManager modifies them.
      operationId: updateAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAccountRequest' }
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /accounts/{accountId}/orders:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      tags: [Orders]
      summary: Place an order
      description: |
        Triggers the full internal flow: OrderController, OrderManager,
        Validation, Execution, PricingEngine, TransactionManager. The order is
        saved as PENDING, then moved to SUCCEEDED or REJECTED. Balance, asset
        and order updates happen in a single database transaction.
        A rejected order is still persisted (status REJECTED) and the request
        returns 422.
      operationId: placeOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaceOrderRequest' }
      responses:
        '201':
          description: Order executed (status SUCCEEDED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Order rejected (insufficient funds or shares, or invalid trade)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      tags: [Orders]
      summary: Get account order history
      operationId: listOrders
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/OrderStatus' }
        - name: ticker
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OrderSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Orders]
      summary: Get one order
      operationId: getOrder
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /accounts/{accountId}/assets:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Assets]
      summary: Get all holdings in an account
      operationId: listAssets
      responses:
        '200':
          description: Holdings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AssetResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /accounts/{accountId}/assets/{ticker}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/Ticker'
    get:
      tags: [Assets]
      summary: Get one holding
      operationId: getAsset
      responses:
        '200':
          description: Holding
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Assets]
      summary: Remove a position from an account (internal / operations)
      description: |
        Removes one account's position in a ticker; it does not delete the
        stock from the system. Normally invoked internally by
        TransactionManager (`account.removeAsset(ticker)`) when a SELL brings
        quantity to zero. Restrict to OPERATIONS access if exposed.
      operationId: deleteAsset
      x-internal: true
      responses:
        '204': { description: Position removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Placeholder until the auth mechanism is finalized.

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Ticker:
      name: ticker
      in: path
      required: true
      schema: { type: string, example: AAPL }

  responses:
    BadRequest:
      description: Validation failure (malformed body, quantity <= 0, unknown enum value)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Authenticated but not allowed (e.g. not the owner)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Conflict (username or email already registered)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    AccessLevel:
      type: string
      enum: ["USER", "ANALYST", "OPERATIONS"]

    AccountType:
      type: string
      enum: ["BROKERAGE", "401K", "ROTH IRA", "CRYPTO", "FOREX"]

    OrderType:
      type: string
      enum: ["EQUITY", "FOREIGN EXCHANGE", "CRYPTO"]

    OrderAction:
      type: string
      description: EXCHANGE is not allowed for EQUITY orders.
      enum: ["BUY", "SELL", "EXCHANGE"]

    OrderStatus:
      type: string
      enum: ["PENDING", "SUCCEEDED", "REJECTED"]

    AssetClass:
      type: string
      enum: ["EQUITY", "CRYPTO", "FOREX"]

    CreateUserRequest:
      type: object
      required: [username, name, email, dob, password]
      properties:
        username: { type: string, maxLength: 255, example: jdoe }
        name: { type: string, maxLength: 255, example: Jane Doe }
        email: { type: string, format: email, maxLength: 255, example: user@email.com }
        phone: { type: string, maxLength: 50, nullable: true, example: "+353851234567" }
        dob: { type: string, format: date, description: Must not be in the future., example: "1998-04-12" }
        password: { type: string, format: password, minLength: 8, maxLength: 72 }

    AuthenticateRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }

    UserResponse:
      type: object
      properties:
        userId: { type: string, format: uuid }
        username: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        dob: { type: string, format: date }
        accessLevel: { $ref: '#/components/schemas/AccessLevel' }
        lastLogin: { type: string, format: date-time, nullable: true }

    AuthResponse:
      type: object
      properties:
        userId: { type: string, format: uuid }
        isAuthenticated: { type: boolean }
        accessLevel: { $ref: '#/components/schemas/AccessLevel' }

    CreateAccountRequest:
      type: object
      required: [accountType]
      properties:
        accountType: { $ref: '#/components/schemas/AccountType' }

    UpdateAccountRequest:
      type: object
      properties:
        accountType: { $ref: '#/components/schemas/AccountType' }

    AccountResponse:
      type: object
      properties:
        accountId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        accountType: { $ref: '#/components/schemas/AccountType' }
        openedDate: { type: string, format: date-time }
        balance: { type: number, example: 25000.00 }
        cashBalance: { type: number, example: 10000.00 }

    PlaceOrderRequest:
      type: object
      required: [orderType, action, ticker, quantity]
      properties:
        orderType: { $ref: '#/components/schemas/OrderType' }
        action: { $ref: '#/components/schemas/OrderAction' }
        ticker: { type: string, minLength: 1, maxLength: 20, example: AAPL }
        quantity:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: Up to 6 decimal places.
          example: 10

    OrderResponse:
      type: object
      properties:
        orderId: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        orderType: { $ref: '#/components/schemas/OrderType' }
        action: { $ref: '#/components/schemas/OrderAction' }
        ticker: { type: string }
        quantity: { type: number }
        submittedValue: { type: number, example: 2500.00 }
        executedValue: { type: number, nullable: true, example: 2512.50 }
        status: { $ref: '#/components/schemas/OrderStatus' }
        submittedOn: { type: string, format: date-time }
        executedOn: { type: string, format: date-time, nullable: true }
        createdOn: { type: string, format: date-time }

    OrderSummary:
      type: object
      properties:
        orderId: { type: string, format: uuid }
        orderType: { $ref: '#/components/schemas/OrderType' }
        action: { $ref: '#/components/schemas/OrderAction' }
        ticker: { type: string }
        quantity: { type: number }
        status: { $ref: '#/components/schemas/OrderStatus' }
        submittedOn: { type: string, format: date-time }
        executedValue: { type: number, nullable: true }

    AssetResponse:
      type: object
      properties:
        assetId: { type: string, format: uuid }
        assetClass: { $ref: '#/components/schemas/AssetClass' }
        ticker: { type: string, example: AAPL }
        name: { type: string, example: Apple Inc. }
        quantity: { type: number, example: 25 }
        boughtAverage: { type: number, description: Stored as averageCost in the database., example: 187.50 }


    ErrorResponse:
      type: object
      properties:
        status: { type: integer, example: 404 }
        error: { type: string, example: Not Found }
        message: { type: string, example: User not found }
        timestamp: { type: string, format: date-time }