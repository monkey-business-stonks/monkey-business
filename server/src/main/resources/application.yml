spring:
  application:
    name: monkeybusiness-server
  
  datasource:
    url: jdbc:postgresql://postgres:5432/monkey_business
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
          fetch_size: 50
  
server:
  port: 8080
  servlet:
    context-path: /

jwt:
  signing-key: ${JWT_SIGNING_KEY:my-secret-key-change-me-in-production}
