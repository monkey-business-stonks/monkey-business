<div class="login-container">
  <div class="login-card">
    <div class="logo-section">
      <div class="logo-title-wrapper">
        <img src="/logo-icon.png" alt="Monkey Business" class="logo-icon" />
        <h1 class="logo-text">
          <span class="logo-primary">MONKEY</span><span class="logo-accent">BUSINESS</span>
        </h1>
      </div>
      
      <p class="subtitle">Enterprise Trading Platform</p>
    </div>

    <form (ngSubmit)="onSignIn()">
      <div class="form-group">
        <label for="username" class="form-label">USERNAME</label>
        <input
          id="username"
          type="email"
          class="form-input"
          placeholder="trader@monkeybusiness.com"
          [(ngModel)]="username"
          name="username"
          required
        />
      </div>

      <div class="form-group">
        <label for="password" class="form-label">PASSWORD</label>
        <input
          id="password"
          type="password"
          class="form-input"
          placeholder="••••••••••"
          [(ngModel)]="password"
          name="password"
          required
        />
      </div>

      <button type="submit" class="sign-in-button" [disabled]="isFormInvalid()">
        Sign In
      </button>
    </form>

    <button type="button" class="forgot-password-link" (click)="onForgotPassword()">
      Forgot password?
    </button>
  </div>
</div>
