<nav class="sub-nav">
  <div class="sub-nav-container">
    
    <!-- Left Group: Workspace Dropdown + Dynamic Nav Tabs -->
    <div class="left-nav-group">
      
      <!-- Workspace Selector Dropdown -->
      @if ((role$ | async) === 'ANALYST') {
        <span class="workspace-label text-sm font-semibold">
          <span class="workspace-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
              <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
              <path d="M9 12h6"></path>
              <path d="M9 16h6"></path>
            </svg>
          </span>
          <span class="workspace-title">Analyst Workspace</span>
        </span>
      } @else {
      <div class="workspace-wrapper">
        <button 
          type="button" 
          class="workspace-selector" 
          (click)="toggleDropdown($event)">
          <span class="workspace-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
              <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
              <path d="M9 12h6"></path>
              <path d="M9 16h6"></path>
            </svg>
          </span>
          <span class="workspace-title text-sm font-semibold">{{ currentWorkspace?.label }}</span>
          <span class="chevron-icon" [class.open]="isDropdownOpen">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </span>
        </button>

        <!-- Workspace Dropdown Options -->
        @if (isDropdownOpen) {
          <div class="workspace-dropdown">
            @for (ws of workspaces; track ws.id) {
              <button 
                type="button"
                class="dropdown-item text-sm font-semibold"
                [class.active]="ws.id === activeWorkspaceId"
                (click)="selectWorkspace(ws)">
                {{ ws.label }}
              </button>
            }
          </div>
        }
      </div>
      }

      <!-- Tabs (Dynamically renders active workspace's tabs) -->
      <div class="nav-tabs">
        @for (tab of currentWorkspace?.tabs; track tab.id) {
          <button 
            type="button"
            class="tab-button text-sm font-semibold"
            [class.active]="tab.id === activeTabId"
            (click)="onTabSelect(tab.id)">
            {{ tab.label }}
            <span class="active-indicator"></span>
          </button>
        }
      </div>

    </div>

    <!-- Dynamic Right Notice Tag -->
    @if (currentWorkspace?.rightNoticeTag) {
      <div class="right-notice text-xs font-semibold">
        {{ currentWorkspace?.rightNoticeTag }}
      </div>
    }

  </div>
</nav>
