<div class="table-wrapper">
  <table class="holdings-table">
    <thead>
      <tr>
        <th 
          *ngFor="let col of columns"
          [ngClass]="col.className || ''"
          [style.text-align]="col.align || 'center'"
          [style.padding-left]="col.paddingX"
          [style.padding-right]="col.paddingX">
          {{ col.header }}
        </th>
      </tr>
    </thead>
    <tbody>
        <tr *ngFor="let row of data" class="table-row"
          [class.selectable]="rowKey !== null"
          [class.selected]="rowKey !== null && selectedRowKey != null && row[rowKey] === selectedRowKey"
          [attr.aria-selected]="rowKey !== null ? row[rowKey] === selectedRowKey : null"
          [attr.tabindex]="rowKey !== null ? 0 : null"
          (click)="rowSelected.emit(row)"
          (keydown.enter)="rowKey !== null && rowSelected.emit(row)"
          (keydown.space)="rowKey !== null && $event.preventDefault(); rowKey !== null && rowSelected.emit(row)">
        <td 
          *ngFor="let col of columns"
          [ngClass]="col.className || ''"
          [class.mono-cell]="col.isMonospace"
          [style.text-align]="col.align || 'center'"
          [style.padding-left]="col.paddingX"
          [style.padding-right]="col.paddingX">
          
          <ng-container *ngIf="cellTemplate; else defaultCell">
            <ng-container *ngTemplateOutlet="cellTemplate; context: { $implicit: row, column: col }"></ng-container>
          </ng-container>
          <ng-template #defaultCell>
            {{ getCellValue(row, col.key) }}
          </ng-template>

        </td>
      </tr>
    </tbody>
  </table>
</div>
