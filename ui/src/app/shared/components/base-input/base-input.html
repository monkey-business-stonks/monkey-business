<div class="field-container">
  @if (label) {
    <label class="field-label">{{ label }}</label>
  }
  <div class="input-wrapper">
    <input
      [type]="type"
      [ngModel]="value"
      (ngModelChange)="valueChange.emit($event)"
      [placeholder]="placeholder"
      [disabled]="disabled"
      [required]="required"
      [name]="name"
      [class.input-invalid]="!!errorMessage"
      [attr.aria-invalid]="errorMessage ? 'true' : null"
      [attr.aria-describedby]="errorMessage ? errorId : null"
      class="custom-input"
    />
    @if (suffix) {
      <span class="input-suffix">{{ suffix }}</span>
    }
  </div>
  @if (errorMessage) {
    <p class="input-error" [id]="errorId" role="alert">{{ errorMessage }}</p>
  }
</div>
