<div class="history-container">
  <section class="filter-card" aria-label="Filter order history">
    <div class="search-bar-wrapper">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input
        type="search"
        class="search-input"
        aria-label="Search your orders"
        placeholder="Search order ID, account, instrument or status"
        [(ngModel)]="searchQuery"
        (keyup.enter)="onSearch()" />
      <span class="search-hint">Your orders only</span>
      <button type="button" class="search-button" (click)="onSearch()">Search</button>
    </div>

    <div class="filter-row">
      <app-select-input label="Order date" [options]="timeRangeOptions" [(value)]="selectedTimeRange" (valueChange)="onFilterChange()"></app-select-input>
      <app-select-input label="Instrument" [options]="instrumentOptions" [(value)]="selectedInstrument" (valueChange)="onFilterChange()"></app-select-input>
      <app-select-input label="Status" [options]="statusOptions" [(value)]="selectedStatus" (valueChange)="onFilterChange()"></app-select-input>
    </div>
  </section>

  @if (loading()) {
    <p>Loading order history...</p>
  } @else if (error()) {
    <p>{{ error() }}</p>
  } @else if (orderData().length === 0) {
    <p class="empty-state">No orders match your search and filters.</p>
  } @else {
    <app-table
      [columns]="orderColumns"
      [data]="orderData()">
    </app-table>
  }
</div>
