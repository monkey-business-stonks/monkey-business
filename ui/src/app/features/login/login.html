<div class="login-container">
  <div class="login-card">
    <div class="logo-section">
      <div class="logo-title-wrapper">
        <img src="/logo-icon.png" alt="Monkey Business" class="logo-icon" />
        <h1 class="logo-text">
          <span class="logo-primary">MONKEY</span><span class="logo-accent">BUSINESS</span>
        </h1>
      </div>
      
      <p class="subtitle">Enterprise Trading Platform</p>
    </div>

    <form (ngSubmit)="onSignIn()">
      <div *ngIf="error()" class="error-message">
        {{ error() }}
      </div>

      <app-base-input
        variant="form"
        label="USERNAME"
        type="email"
        placeholder="trader@monkeybusiness.com"
        [(value)]="username"
        name="username"
        [disabled]="loading()"
        [required]="true"
      />

      <app-base-input
        variant="form"
        label="PASSWORD"
        type="password"
        placeholder="••••••••••"
        [(value)]="password"
        name="password"
        [disabled]="loading()"
        [required]="true"
      />

      <app-button variant="secondary" [disabled]="loading() || !isFormValid()">
        {{ loading() ? 'Signing In...' : 'Sign In' }}
      </app-button>
    </form>

    <button type="button" class="forgot-password-link" (click)="onCreateAccount()">
      Need an account? <span class="create-user-link">Create account</span>
    </button>
  </div>
</div>
