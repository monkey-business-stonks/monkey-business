<app-table [columns]="columns" [data]="holdings">
  <ng-template #cellTemplate let-row let-column="column">
    
    <!-- Custom template override for ticker / asset name column -->
    <ng-container *ngIf="column.key === 'ticker'; else standardCell">
      <div class="ticker">{{ row.ticker }}</div>
      <div class="asset-name">{{ row.assetName }}</div>
    </ng-container>

    <ng-template #standardCell>
      {{ row[column.key] }}
    </ng-template>

  </ng-template>
</app-table>
