<div class="navbar">
  <div class="navleft">
    <div class="logo">
      <p class="monkey">MONKEY</p>
      <p class="business">BUSINESS</p>
    </div>
    
    <div class="navbuttons">
      @if ((role$ | async) === 'ANALYST' || (role$ | async) === 'OPERATIONS') {
        <span class="internal-workspace-text">Internal Workspace</span>
      } @else {
        <app-button variant="nav" routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" #dashboardRoute="routerLinkActive" [active]="dashboardRoute.isActive">Dashboard</app-button>
        <app-button variant="nav" routerLink="/trade" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" #tradeRoute="routerLinkActive" [active]="tradeRoute.isActive">Trade</app-button>
        <app-button variant="nav" routerLink="/history" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" #historyRoute="routerLinkActive" [active]="historyRoute.isActive">History</app-button>
      }
    </div>
  </div>

  @if ((role$ | async) === 'USER') {
  <div class="profile-container">
    <button class="profile-icon-button" routerLink="/profile">
      <img class="profile-icon" src="/monkey-face.png" alt="" aria-hidden="true">
      <span class="profile-text">
        <span class="profile-name">{{ userName || 'Profile' }}</span>
        <span class="profile-role">BASE USER</span>
      </span>
    </button>
  </div>
  }

  @if ((role$ | async) === 'ANALYST' || (role$ | async) === 'OPERATIONS') {
  <div class="internal-session-actions">
    <app-button variant="primary" (click)="onLogout()">LOGOUT</app-button>
  </div>
  }
</div>
