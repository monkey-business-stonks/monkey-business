<div class="user-panel-container">
  <div class="avatar-section">
    <div class="avatar-container">
      <img [src]="avatar" alt="User Avatar" class="avatar-image" />
    </div>
    <p class="name">{{ user()?.name || user()?.username || 'User' }}</p>
    <p class="email">{{ user()?.email || 'Email unavailable' }}</p>
  </div>
  <table class="info-table">
    <tr>
      <td colspan="2"><hr class="table-hr"></td>
    </tr>
    <tr class="standard">
      <td class="table-left">ACCESS</td>
      <td class="table-right">{{ user()?.accessLevel || 'UNKNOWN' }}</td>
    </tr>
    <tr>
      <td class="table-left">MEMBER SINCE</td>
      <td class="table-right">{{ user()?.createdOn ? ((user()?.createdOn | date: 'MMM yyyy') | uppercase) : 'UNKNOWN' }}</td>
    </tr>
    <tr>
      <td class="table-left">REGISTRATION COUNTRY</td>
      <td class="table-right">UNITED STATES</td>
    </tr>
    <tr>
      <td colspan="2"><hr class="table-hr"></td>
    </tr>
    <tr>
      <td colspan="2" class="logout-cell">
        <button type="button" class="logout-btn" (click)="onLogout()">
          LOGOUT
        </button>
      </td>
    </tr>
  </table>
</div>
