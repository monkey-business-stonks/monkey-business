<div class="user-panel-container">
  <div class="avatar-section">
    <div class="avatar-container">
      <img [src]="avatar" alt="User Avatar" class="avatar-image" />
    </div>
    <p class="name">Monkey Business Trader</p>
    <p class="email">trader@monkeybusiness.com</p>
  </div>
  <hr>
  <table class="info-table">
    <tr class="standard">
      <td class="table-left">STATUS</td>
      <td class="table-right">ACTIVE</td>
    </tr>
    <tr>
      <td class="table-left">MEMBER SINCE</td>
      <td class="table-right">JAN 2024</td>
    </tr>
    <tr>
      <td class="table-left">REGISTRATION COUNTRY</td>
      <td class="table-right">UNITED STATES</td>
    </tr>
    <tr>
      <td class="table-left">FAVORITE INDEX</td>
      <td class="table-right">NASDAQ 100</td>
    </tr>
  </table>
</div>
