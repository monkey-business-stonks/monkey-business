<div class="profile-wrapper">
  <div class="user-container">
    <user-panel [user]="user()"></user-panel>
  </div>
  <div class="info-container">
    @if (isEditMode) {
      <edit-panel
        [user]="user()"
        [saving]="isSavingProfile"
        [saveError]="profileSaveError"
        (saveConfiguration)="saveProfileChanges($event)"
        (cancelEdit)="saveAndReturnToAccounts()"
      ></edit-panel>
    } @else {
      <accounts-panel
        [showEditProfileButton]="true"
        (editProfile)="toggleEditMode()"
      ></accounts-panel>
    }
  </div>
</div>
