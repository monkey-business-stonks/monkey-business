<div class="trade-search-container">
  <input
    class="search-bar"
    type="text"
    placeholder="Search tickers..."
    (keyup.enter)="handleSearchSubmit($event)"
  >

  <div class="filter-buttons">
    <button
      type="button"
      class="filter-btn"
      [class.active]="isFilterActive('EQUITY')"
      (click)="toggleFilter('EQUITY')"
    >
      EQUITY
    </button>
    <button
      type="button"
      class="filter-btn"
      [class.active]="isFilterActive('CRYPTO')"
      (click)="toggleFilter('CRYPTO')"
    >
      CRYPTO
    </button>
    <button
      type="button"
      class="filter-btn"
      [class.active]="isFilterActive('FOREX')"
      (click)="toggleFilter('FOREX')"
    >
      FOREX
    </button>
  </div>

  <div class="rows-list">
    <ng-container *ngIf="hasSearched()">
      <div class="subsection-header">Results</div>

      <div *ngIf="searchError()" class="search-error-row">
        <div class="error-info">
          <span class="error-title">Instrument "{{ searchQuery() }}" not found</span>
          <span class="error-description">
            Please verify the symbol and try again.
          </span>
        </div>
      </div>

      <ng-container *ngIf="!searchError()">
        <!-- Search Loading: Exactly 1 Shimmer Row -->
        <div *ngIf="isSearching(); else searchResultsTemplate" class="shimmer-rows">
          <div class="shimmer-row"></div>
        </div>

        <ng-template #searchResultsTemplate>
          <div *ngIf="resultsList().length > 0; else noResultsTemplate" class="rows-group">
            <trade-search-row
              *ngFor="let asset of resultsList()"
              [row]="asset"
              [selected]="selectedAsset?.data?.symbol === asset.data.symbol"
              (rowClick)="handleSelect($event)"
            ></trade-search-row>
          </div>
          <ng-template #noResultsTemplate>
            <div class="no-results-message">no results to display</div>
          </ng-template>
        </ng-template>
      </ng-container>
    </ng-container>

    <ng-container *ngIf="recentsList().length > 0">
      <div class="subsection-header">Recents</div>
      <div class="rows-group">
        <trade-search-row
          *ngFor="let asset of recentsList()"
          [row]="asset"
          [selected]="selectedAsset?.data?.symbol === asset.data.symbol"
          (rowClick)="handleSelect($event)"
        ></trade-search-row>
      </div>
    </ng-container>

    <div class="subsection-header">Top Instruments</div>
    
    <!-- Top 25 Loading: Exactly 6 Shimmer Rows -->
    <div *ngIf="isTopLoading()" class="shimmer-rows">
      <div class="shimmer-row"></div>
      <div class="shimmer-row"></div>
      <div class="shimmer-row"></div>
      <div class="shimmer-row"></div>
      <div class="shimmer-row"></div>
      <div class="shimmer-row"></div>
    </div>

    <div *ngIf="!isTopLoading() && topInstrumentsList().length > 0" class="rows-group">
      <trade-search-row
        *ngFor="let asset of topInstrumentsList()"
        [row]="asset"
        [selected]="selectedAsset?.data?.symbol === asset.data.symbol"
        (rowClick)="handleSelect($event)"
      ></trade-search-row>
    </div>
  </div>

  <app-button
    variant="secondary"
    [disabled]="!selectedAsset"
    (click)="selectedAsset && onTickerSelected.emit(selectedAsset)"
  >
    {{ selectedAsset
      ? `Trade ${selectedAsset.data.symbol}`
      : 'Select ticker to trade'
    }}
  </app-button>
</div>
