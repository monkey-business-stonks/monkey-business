services:
  postgres:
    image: postgres:18-alpine
    container_name: monkey_business_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: n3u3d4!
      POSTGRES_DB: monkey_business
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/databasescript.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: monkey_business_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  auth:
    build:
      context: ./auth
      dockerfile: Dockerfile
    container_name: monkey_business_auth
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      JWT_SIGNING_KEY: my-secret-key-change-me-in-production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: monkey_business_backend
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/monkey_business
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: n3u3d4!
      JWT_SIGNING_KEY: my-secret-key-change-me-in-production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/users/health"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3

  frontend:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: monkey_business_frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend
    environment:
      API_URL: http://backend:8080/api
      AUTH_URL: http://auth:3000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4200/"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  postgres_data:
  pgadmin_data:
