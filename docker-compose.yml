services:
  # Zookeeper - Kafka coordination (3-node ensemble)
  zk-1:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: monkey_business_zk1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_SERVERS: zk-1:2888:3888;zk-2:2888:3888;zk-3:2888:3888
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - zk_1_data:/var/lib/zookeeper/data
      - zk_1_log:/var/lib/zookeeper/log

  zk-2:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: monkey_business_zk2
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_SERVER_ID: 2
      ZOOKEEPER_SERVERS: zk-1:2888:3888;zk-2:2888:3888;zk-3:2888:3888
    ports:
      - "2182:2181"
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - zk_2_data:/var/lib/zookeeper/data
      - zk_2_log:/var/lib/zookeeper/log

  zk-3:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: monkey_business_zk3
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_SERVER_ID: 3
      ZOOKEEPER_SERVERS: zk-1:2888:3888;zk-2:2888:3888;zk-3:2888:3888
    ports:
      - "2183:2181"
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - zk_3_data:/var/lib/zookeeper/data
      - zk_3_log:/var/lib/zookeeper/log

  # Kafka - Message broker (3-node cluster)
  kafka-1:
    image: confluentinc/cp-kafka:7.5.0
    container_name: monkey_business_kafka1
    depends_on:
      zk-1:
        condition: service_healthy
      zk-2:
        condition: service_healthy
      zk-3:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zk-1:2181,zk-2:2181,zk-3:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "29092:29092"
      - "9092:9092"
    volumes:
      - kafka_1_data_v2:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-2:
    image: confluentinc/cp-kafka:7.5.0
    container_name: monkey_business_kafka2
    depends_on:
      zk-1:
        condition: service_healthy
      zk-2:
        condition: service_healthy
      zk-3:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zk-1:2181,zk-2:2181,zk-3:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092,PLAINTEXT_HOST://localhost:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "29093:29092"
      - "9093:9092"
    volumes:
      - kafka_2_data_v2:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-3:
    image: confluentinc/cp-kafka:7.5.0
    container_name: monkey_business_kafka3
    depends_on:
      zk-1:
        condition: service_healthy
      zk-2:
        condition: service_healthy
      zk-3:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zk-1:2181,zk-2:2181,zk-3:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092,PLAINTEXT_HOST://localhost:29094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "29094:29092"
      - "9094:9092"
    volumes:
      - kafka_3_data_v2:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:18-alpine
    container_name: monkey_business_db
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - wal_keep_size=512MB
      - -c
      - hot_standby=on
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      REPLICATION_USER: ${REPLICATION_USER:?REPLICATION_USER is required}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?REPLICATION_PASSWORD is required}
      ANALYTICS_DB_USER: ${ANALYTICS_DB_USER:?ANALYTICS_DB_USER is required}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:?ANALYTICS_DB_PASSWORD is required}
      OPERATIONS_DB_USER: ${OPERATIONS_DB_USER:?OPERATIONS_DB_USER is required}
      OPERATIONS_DB_PASSWORD: ${OPERATIONS_DB_PASSWORD:?OPERATIONS_DB_PASSWORD is required}
      SEED_USER_PREFIX: ${SEED_USER_PREFIX:?SEED_USER_PREFIX is required}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:?SEED_USER_PASSWORD is required}
      SEED_ANALYST_PREFIX: ${SEED_ANALYST_PREFIX:?SEED_ANALYST_PREFIX is required}
      SEED_ANALYST_PASSWORD: ${SEED_ANALYST_PASSWORD:?SEED_ANALYST_PASSWORD is required}
      SEED_OPERATIONS_USERNAME: ${SEED_OPERATIONS_USERNAME:?SEED_OPERATIONS_USERNAME is required}
      SEED_OPERATIONS_PASSWORD: ${SEED_OPERATIONS_PASSWORD:?SEED_OPERATIONS_PASSWORD is required}
      POSTGRES_DB: monkey_business
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/replication/primary-init/01-replication-hba.sh:/docker-entrypoint-initdb.d/01-replication-hba.sh
      - ./db/databasescript.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./db/replication/primary-init/02-replication-setup.sql:/docker-entrypoint-initdb.d/02-replication-setup.sql
      - ./db/analytics_seed.sql:/docker-entrypoint-initdb.d/03-analytics-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_replica:
    image: postgres:18-alpine
    container_name: monkey_business_db_replica
    user: postgres
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: monkey_business
      PRIMARY_HOST: postgres
      PRIMARY_PORT: 5432
      REPLICATION_USER: ${REPLICATION_USER:?REPLICATION_USER is required}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?REPLICATION_PASSWORD is required}
      REPLICATION_SLOT: monkey_business_replica_slot
      REPLICA_MAX_LAG_SECONDS: 300
    command: ["/bin/bash", "/replica/init-replica.sh"]
    expose:
      - "5432"
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./db/replication/replica/init-replica.sh:/replica/init-replica.sh:ro
      - ./db/replication/replica/healthcheck.sh:/replica/healthcheck.sh:ro
      - ./db/replication/replica/replication-metrics.sql:/replica/replication-metrics.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "/replica/healthcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: monkey_business_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?PGADMIN_DEFAULT_EMAIL is required}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD is required}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  auth:
    build:
      context: ./auth
      dockerfile: Dockerfile
    container_name: monkey_business_auth
    environment:
      PORT: 3000
      NODE_ENV: production
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: monkey_business_backend
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      postgres_replica:
        condition: service_healthy
      auth:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/monkey_business
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      ANALYTICS_DATASOURCE_URL: jdbc:postgresql://postgres_replica:5432/monkey_business
      ANALYTICS_DATASOURCE_USERNAME: ${ANALYTICS_DB_USER:?ANALYTICS_DB_USER is required}
      ANALYTICS_DATASOURCE_PASSWORD: ${ANALYTICS_DB_PASSWORD:?ANALYTICS_DB_PASSWORD is required}
      ANALYTICS_PRIMARY_FALLBACK_ENABLED: "false"
      ANALYTICS_MAX_REPLICA_LAG_SECONDS: "300"
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
      AUTH_SERVICE_URL: http://auth:3000
      MARKET_DATA_API_KEY: ${MARKET_DATA_API_KEY:?MARKET_DATA_API_KEY is required}
      KAFKA_BROKERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/users/health"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3

  analytics-python:
    build:
      context: ./analytics
      dockerfile: Dockerfile
    container_name: monkey_business_analytics_python
    depends_on:
      postgres_replica:
        condition: service_healthy
    environment:
      ANALYTICS_DB_HOST: postgres_replica
      ANALYTICS_DB_PORT: 5432
      ANALYTICS_DB_NAME: monkey_business
      ANALYTICS_DB_USER: ${ANALYTICS_DB_USER:?ANALYTICS_DB_USER is required}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:?ANALYTICS_DB_PASSWORD is required}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
      JWT_ALGORITHM: HS256
    ports:
      - "8001:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 5

  frontend:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: monkey_business_frontend
    ports:
      - "4200:4200"
    depends_on:
      backend:
        condition: service_started
      analytics-python:
        condition: service_healthy
    environment:
      API_URL: http://backend:8080/api
      AUTH_URL: http://auth:3000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4200/"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  zk_1_data:
  zk_1_log:
  zk_2_data:
  zk_2_log:
  zk_3_data:
  zk_3_log:
  postgres_data:
  postgres_replica_data:
  pgadmin_data:
  kafka_1_data_v2:
  kafka_2_data_v2:
  kafka_3_data_v2:
