version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: monkey-business-db
    environment:
      POSTGRES_DB: monkey_business
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/databasescript.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - monkey-business-network

  # Spring Boot Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: monkey-business-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/monkey_business
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - monkey-business-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/users/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Angular Frontend
  frontend:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: monkey-business-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - monkey-business-network
    environment:
      API_URL: http://backend:8080/api

volumes:
  postgres_data:
    driver: local

networks:
  monkey-business-network:
    driver: bridge
